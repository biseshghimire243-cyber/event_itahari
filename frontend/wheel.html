<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Win</title>

<style>

body{
margin:0;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
flex-direction:column;
color:#fff;
}

canvas{
background:#fff;
border-radius:50%;
box-shadow:0 0 30px rgba(255,255,255,.3);
}

button{
margin-top:30px;
padding:15px 40px;
font-size:18px;
cursor:pointer;
border:none;
border-radius:50px;
background:#2563eb;
color:#fff;
}

.pointer{
font-size:40px;
margin-bottom:-15px;
z-index:2;
}

#result{
margin-top:25px;
font-size:28px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="pointer">▼</div>

<canvas id="wheel" width="500" height="500"></canvas>

<button id="spin">SPIN NOW</button>

<div id="result"></div>

<script>

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const rewards=[
"10% OFF",
"Photography",
"DJ",
"Videography",
"Decoration",
"20% OFF",
"Flowers",
"Balloons"
];

const colors=[
"#ef4444",
"#3b82f6",
"#22c55e",
"#f59e0b",
"#8b5cf6",
"#06b6d4",
"#ec4899",
"#84cc16"
];

const arc=Math.PI*2/rewards.length;

let angle=0;

function draw(){

ctx.clearRect(0,0,500,500);

for(let i=0;i<rewards.length;i++){

ctx.beginPath();

ctx.moveTo(250,250);

ctx.fillStyle=colors[i];

ctx.arc(
250,
250,
240,
i*arc+angle,
(i+1)*arc+angle
);

ctx.fill();

ctx.save();

ctx.translate(250,250);

ctx.rotate(i*arc+arc/2+angle);

ctx.fillStyle="white";

ctx.font="20px Arial";

ctx.fillText(rewards[i],110,10);

ctx.restore();

}

}

draw();

let spinning=false;

document.getElementById("spin").onclick=function(){

if(spinning)return;

spinning=true;

let speed=Math.random()*0.3+0.35;

const timer=setInterval(()=>{

angle+=speed;

speed*=0.985;

draw();

if(speed<0.002){

clearInterval(timer);

spinning=false;

let index=Math.floor(((2*Math.PI-angle%(2*Math.PI))/arc))%rewards.length;

document.getElementById("result").innerHTML=

"🎉 You Won: <br>"+rewards[index];

}

},20);

}

</script>

</body>
</html>
